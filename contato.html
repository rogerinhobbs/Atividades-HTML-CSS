<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contato – Ecobots</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- BARRA DE NAVEGAÇÃO -->
  <header class="barra-navegacao">
    <div class="logo">
      <img src="img/logo.png" alt="Logo Ecobots" />
    </div>

    <nav class="links-navegacao">
      <a href="index.html">Início</a>
      <a href="quem-somos.html">Quem Somos</a>
      <a href="solucoes.html">Soluções</a>
      <a class="ativo" href="contato.html">Contato</a>
      <button id="alternar-tema" aria-label="Alternar tema">🌙</button>
    </nav>
  </header>

  <!-- CABEÇALHO DA PÁGINA -->
  <section class="quem-somos-cabecalho">
    <h1>Entre em Contato</h1>
    <p>Fale com a nossa equipe e leve tecnologia sustentável para sua cidade ou organização.</p>
  </section>

  <!-- FORMULÁRIO DE CONTATO -->
  <section class="secao-formulario">
    <div class="formulario-container">

      <h2>Envie sua mensagem</h2>

      <form class="formulario-contato" action="#" method="post">
        
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required placeholder="Seu melhor e-mail">

        <label for="assunto">Assunto</label>
        <input type="text" id="assunto" name="assunto" required placeholder="Sobre o que deseja falar?">

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="6" required placeholder="Digite sua mensagem"></textarea>

        <button type="submit" class="botao-primario">Enviar Mensagem</button>

      </form>

    </div>
  </section>

  <!-- RODAPÉ -->
  <footer class="rodape">
    <div class="links-rodape">
      <a href="index.html">Início</a>
      <a href="quem-somos.html">Quem Somos</a>
      <a href="solucoes.html">Soluções</a>
      <a href="contato.html">Contato</a>
    </div>
    <p>© 2025 Ecobots. Todos os direitos reservados.</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
